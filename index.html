<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>야, 너도 들을 수 있어! - 소리 퀴즈</title>
    <meta name="theme-color" content="#D8773B">
    <link href="https://webfontworld.github.io/gmarket/GmarketSans.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="소리퀴즈" />
    <link rel="manifest" href="/site.webmanifest" />
</head>
<body>
    <div class="app">
        <header class="hero">
            <h1 class="hero-title">야, 너도 들을 수 있어<em>!</em></h1>
            <svg class="hills" viewBox="0 0 400 70" aria-hidden="true">
                <g fill="#F28B4B"><circle cx="30" cy="50" r="40"/><circle cx="140" cy="40" r="44"/><circle cx="262" cy="46" r="42"/><circle cx="380" cy="36" r="46"/></g>
                <g fill="#F6C419"><circle cx="-10" cy="70" r="36"/><circle cx="95" cy="66" r="30"/><circle cx="330" cy="70" r="34"/></g>
                <g fill="#D98760"><circle cx="205" cy="74" r="38"/><circle cx="410" cy="76" r="32"/></g>
            </svg>
        </header>

        <main class="sheet board" id="board">
            <ol class="spots" id="spots">
                <noscript><li>소리를 들으려면 브라우저의 자바스크립트를 켜 주세요.</li></noscript>
            </ol>

            <button type="button" class="chip-button" id="shuffleBtn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                문제 섞기
            </button>

            <!-- 화면 읽기 프로그램용 안내 (화면에는 안 보임) -->
            <p class="sr-only" id="status" aria-live="polite"></p>
        </main>

        <nav class="tabbar" aria-label="보기 전환">
            <button type="button" class="tab is-active" data-mode="quiz" aria-pressed="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></svg>
                <span>소리 퀴즈</span>
            </button>
            <button type="button" class="tab" data-mode="answer" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
                <span>정답 확인</span>
            </button>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
